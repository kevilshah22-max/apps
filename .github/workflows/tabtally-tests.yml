name: TabTally checks
on:
  push:
    branches:
      - nexa-forge-tabtally-mvp-20261019
    paths:
      - "public/tabtally/**"
      - ".github/workflows/tabtally-tests.yml"
  pull_request:
    paths:
      - "public/tabtally/**"
      - ".github/workflows/tabtally-tests.yml"
permissions:
  contents: read
jobs:
  tabtally-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run bill-splitting regression tests
        run: node --test public/tabtally/tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check public/tabtally/app.js
          node --check public/tabtally/core.mjs
