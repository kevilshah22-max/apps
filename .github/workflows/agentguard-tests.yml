name: AgentGuard regression tests

on:
  push:
    branches: [main, feat/agentguard-public-mvp-20261023]
    paths:
      - "site/agentguard/**"
      - "tests/agentguard/**"
      - ".github/workflows/agentguard-tests.yml"
  pull_request:
    paths:
      - "site/agentguard/**"
      - "tests/agentguard/**"
      - ".github/workflows/agentguard-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run risk-engine regression tests
        run: node --test site/agentguard/tests/*.test.mjs
      - name: Check JavaScript syntax
        run: |
          node --check site/agentguard/app.js
          node --check site/agentguard/risk-engine.mjs
      - name: Install browser-test dependencies
        working-directory: tests/agentguard
        run: npm install --no-audit --no-fund
      - name: Install Chromium
        working-directory: tests/agentguard
        run: npx playwright install --with-deps chromium
      - name: Run browser smoke tests
        run: node tests/agentguard/browser-smoke.mjs
