name: CartoonForge local render-agent tests
on:
  pull_request:
    paths:
      - "cartoonforge-agent/**"
      - "tests/test_script_agent.py"
      - "tests/test_cartoonforge_browser.py"
      - "site/cartoonforge/index.html"
      - "tests/cartoonforge_agent_test_loader.py"
      - "tests/test_render_agent.py"
      - ".github/workflows/cartoonforge-agent-tests.yml"
  push:
    branches: [main]
    paths:
      - "cartoonforge-agent/**"
      - "tests/test_render_agent.py"
      - ".github/workflows/cartoonforge-agent-tests.yml"
permissions:
  contents: read
jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m unittest discover -s tests -p 'test_render_agent.py' -v
      - run: python -m unittest discover -s tests -p 'test_script_agent.py' -v
      - run: python -m unittest discover -s tests -p 'test_cartoonforge_browser.py' -v
      - name: Check embedded browser JavaScript syntax
        run: node -e 'const fs=require("fs"); const html=fs.readFileSync("site/cartoonforge/index.html","utf8"); const scripts=[...html.matchAll(/<script>([\s\S]*?)<\/script>/g)]; if(!scripts.length) throw new Error("No inline script found"); new Function(scripts[scripts.length-1][1]);'
      - run: python -m py_compile cartoonforge-agent/render_agent.py cartoonforge-agent/script_agent.py
