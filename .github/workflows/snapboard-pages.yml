name: Deploy Snapboard Web
on:
  push:
    branches: ["main"]
    paths:
      - "apps/snapboard-web/**"
      - ".github/workflows/snapboard-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: $\{{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: apps/snapboard-web
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
